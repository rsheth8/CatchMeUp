[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catchmeup"
version = "0.1.0"
description = "Missed the Zoom. Missed lecture. Still got the notes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.40.0",
  "openai>=1.40.0",
  "python-docx>=1.1.0",
  "pypdf>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["catchmeup*"]
