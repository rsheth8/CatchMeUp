[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catchmeup"
dynamic = ["version"]
description = "Missed the Zoom. Missed lecture. Still got the notes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "anthropic>=0.40.0",
  "openai>=1.40.0",
  "python-docx>=1.1.0",
  "pypdf>=5.0.0",
]

[project.scripts]
catchup = "catchmeup.cli:main"

[project.optional-dependencies]
build = ["build>=1.2", "twine>=6", "pyinstaller>=6.16"]

[tool.setuptools.dynamic]
version = {attr = "catchmeup.__version__"}

[tool.setuptools.packages.find]
include = ["catchmeup*"]
