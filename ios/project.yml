name: CatchMeUp
options:
  bundleIdPrefix: com.catchmeup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Left blank on purpose: it's per-developer. Archiving for TestFlight needs
    # a real one — see ios/BETA.md for the one-line invocation.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  CatchMeUp:
    type: application
    platform: iOS
    sources:
      - path: CatchMeUp
      - path: Shared
    dependencies:
      - target: CatchMeUpWidgets
        embed: true
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catchmeup.app
        INFOPLIST_FILE: CatchMeUp/Info.plist
        CODE_SIGN_ENTITLEMENTS: CatchMeUp/CatchMeUp.entitlements
    scheme:
      testTargets:
        - CatchMeUpTests

  CatchMeUpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CatchMeUpTests
    dependencies:
      - target: CatchMeUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catchmeup.app.tests
        GENERATE_INFOPLIST_FILE: YES

  CatchMeUpWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CatchMeUpWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catchmeup.app.widgets
        PRODUCT_NAME: CatchMeUpWidgets
        INFOPLIST_FILE: CatchMeUpWidgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
