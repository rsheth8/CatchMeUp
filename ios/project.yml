name: CatchMeUp
options:
  bundleIdPrefix: com.catchmeup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  CatchMeUp:
    type: application
    platform: iOS
    sources:
      - path: CatchMeUp
      - path: Shared
    dependencies:
      - target: CatchMeUpWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catchmeup.app
        INFOPLIST_FILE: CatchMeUp/Info.plist
        CODE_SIGN_ENTITLEMENTS: CatchMeUp/CatchMeUp.entitlements

  CatchMeUpWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CatchMeUpWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catchmeup.app.widgets
        PRODUCT_NAME: CatchMeUpWidgets
        INFOPLIST_FILE: CatchMeUpWidgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
