name: CatchMeUp
options:
  bundleIdPrefix: com.catchmeup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_CFBundleDisplayName: CatchMeUp
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "CatchMeUp records audio so it can turn a meeting or lecture into notes."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "CatchMeUp transcribes your recordings on this device to write the notes. Audio stays on your iPhone."
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  CatchMeUp:
    type: application
    platform: iOS
    sources:
      - path: CatchMeUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catchmeup.app
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        CODE_SIGN_ENTITLEMENTS: CatchMeUp/CatchMeUp.entitlements
